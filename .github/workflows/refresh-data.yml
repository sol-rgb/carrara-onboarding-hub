name: Weekly data refresh

# Keeps team.json, clients.json and codex.json current. Those snapshots are what
# the hub renders whenever the live API tokens are missing, so without this they
# silently go stale. Runs before the Monday link check.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh snapshots from Slack and Notion
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/refresh-data.js

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- team.json clients.json codex.json; then
            echo "No changes this week."
            exit 0
          fi
          git config user.name  "carrara-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team.json clients.json codex.json
          git commit -m "Weekly data refresh: team and clients

          Regenerated from Slack and the Notion Client Codex by
          .github/workflows/refresh-data.yml. Data only, no code changes."
          git push
