name: Weekly data refresh

# Keeps team.json, clients.json and codex.json current. Those snapshots are what
# the hub renders whenever the live API tokens are missing, so without this they
# silently go stale. Runs before the Monday link check.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Secrets are lifted to job env so each step can skip itself when its own
    # token is missing, instead of one absent token failing every source.
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Clients: new rows, tag changes and Active/Paused, straight from the Codex
      - name: Refresh clients from the Client Codex
        if: env.NOTION_TOKEN != ''
        run: node scripts/refresh-data.js

      # Team: joiners and leavers, plus each person's Slack photo saved into the repo
      - name: Refresh the roster and photos from Slack
        if: ${{ !cancelled() && env.SLACK_BOT_TOKEN != '' }}
        run: node scripts/refresh-team.js

      # People Pavilion: team, location and the question answers
      - name: Refresh people from the Team Directory
        if: ${{ !cancelled() && env.NOTION_TOKEN != '' }}
        run: node scripts/refresh-people.js

      # Runs even when an earlier source failed, so what did refresh is kept.
      # The run is still marked failed, so a broken source stays visible.
      - name: Commit if anything changed
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- team.json clients.json codex.json people.json assets/people; then
            echo "No changes this week."
            exit 0
          fi
          git config user.name  "carrara-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team.json clients.json codex.json people.json assets/people
          git commit -m "Weekly data refresh: team, clients and profiles

          Regenerated from the Notion Client Codex (and Slack, when its token
          is set) by
          .github/workflows/refresh-data.yml. Data only, no code changes."
          git push
